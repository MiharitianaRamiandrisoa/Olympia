name: Deploy Olympia

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: olympia-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/
          local-dir: ./
          security: strict
          exclude: |
            **/.git*/**
            **/.git*
            **/.env.dev
            **/.env.test
            **/.env.local
            **/.env.local.php
            **/node_modules/**
            **/vendor/**
            **/var/**
            **/public/uploads/**
            **/.phpunit.cache/**

      - name: Installer les dépendances PHP sur le serveur
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            SERVER_DIR='${{ secrets.SSH_SERVER_DIR || '/home/olympiam/domains/olympia-madagascar.mg/public_html' }}'

            cd "$SERVER_DIR"

            echo "Dossier : $(pwd)"

            printf '%s\n' \
              'APP_ENV=prod' \
              'APP_DEBUG=0' \
              'APP_SHARE_DIR=var/share' \
              'DEFAULT_URI=https://olympia-madagascar.mg' \
              'MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0' \
              'MAILER_DSN=null://null' > .env

            if [ ! -f .env.local ]; then
              echo "ERREUR : .env.local est absent du serveur et contient les secrets de production."
              exit 1
            fi
            sed -i '/^APP_ENV=/d; /^APP_DEBUG=/d' .env.local

            export APP_ENV=prod
            export APP_DEBUG=0
            mkdir -p var/cache var/log var/share

            if ! command -v php >/dev/null 2>&1; then
              echo "ERREUR : PHP n'est pas disponible."
              exit 1
            fi

            if ! command -v composer >/dev/null 2>&1; then
              echo "ERREUR : Composer n'est pas disponible."
              exit 1
            fi

            echo "Installation des dépendances PHP..."

            composer install \
              --no-dev \
              --no-scripts \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader

            php bin/console doctrine:migrations:migrate \
              --env=prod \
              --no-interaction \
              --allow-no-migration
            php bin/console cache:clear --env=prod

            echo "Déploiement terminé."
