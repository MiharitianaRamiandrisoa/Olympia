


name: Deploy Olympia

on:
  push:
    branches: [main, Dev, dev]

permissions:
  contents: read

concurrency:
  group: olympia-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref_name == 'main' }}
    name: Déploiement production
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Déployer uniquement les sources par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/
          local-dir: ./
          security: strict
          exclude: |
            **/.git*/**
            **/.git*
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/var/**
            **/public/assets/**
            **/public/build/**
            **/public/uploads/**
            **/assets/vendor/**
            **/.phpunit.cache/**

      - name: Installer les dépendances PHP et préparer Symfony
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DB_HOST: ${{ secrets.HOST_BASE }}
          DB_NAME: ${{ secrets.NOM_BASE }}
          DB_USER: ${{ secrets.NOM_UTILISATEUR }}
          DB_PASSWORD: ${{ secrets.MOT_DE_PASSE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: APP_SECRET,DB_HOST,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -e

            SERVER_DIR='${{ secrets.SSH_SERVER_DIR || '/home/olympiam/domains/olympia-madagascar.mg/public_html' }}'
            cd "$SERVER_DIR"

            umask 077
            printf '%s\n' \
              'APP_ENV=prod' \
              'APP_DEBUG=0' \
              'APP_SHARE_DIR=var/share' \
              'DEFAULT_URI=https://olympia-madagascar.mg' \
              'MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0' \
              'MAILER_DSN=null:/  /null' > .env

            if [ -z "${APP_SECRET:-}" ] || [ -z "${DB_HOST:-}" ] || [ -z "${DB_NAME:-}" ] || [ -z "${DB_USER:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
              echo "ERREUR : les secrets de production sont incomplets."
              exit 1
            fi

            printf 'APP_ENV=prod\nAPP_DEBUG=0\nAPP_SECRET=%s\nDATABASE_URL="mysql://%s:%s@%s:3306/%s?serverVersion=8.0.0&charset=utf8mb4"\n' \
              "$APP_SECRET" "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$DB_NAME" > .env.local

            export APP_ENV=prod
            export APP_DEBUG=0
            mkdir -p var/cache var/log var/share

            command -v php >/dev/null 2>&1 || { echo "ERREUR : PHP n'est pas disponible."; exit 1; }
            command -v composer >/dev/null 2>&1 || { echo "ERREUR : Composer n'est pas disponible."; exit 1; }

            composer install \
              --no-dev \
              --no-scripts \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader

            php bin/console doctrine:migrations:migrate \
              --env=prod \
              --no-interaction \
              --allow-no-migration

            php bin/console cache:clear --env=prod
            find public -type d -exec chmod 755 {} +
            find public -type f -exec chmod 644 {} +

            echo "Sources transférées. Compilation des assets laissée manuelle."

  deploy-preprod:
    if: ${{ github.ref_name == 'Dev' || github.ref_name == 'dev' }}
    name: Deploy preproduction
    runs-on: ubuntu-latest
    environment:
      name: preprod
      url: https://test.olympia-madagascar.mg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy sources by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PREPROD_FTP_HOST || secrets.FTP_HOST }}
          username: ${{ secrets.PREPROD_FTP_USER }}
          password: ${{ secrets.PREPROD_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.PREPROD_FTP_SERVER_DIR || '/public_html/' }}
          local-dir: ./
          security: strict
          exclude: |
            **/.git*/**
            **/.git*
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/var/**
            **/public/assets/**
            **/public/build/**
            **/public/uploads/**
            **/assets/vendor/**
            **/.phpunit.cache/**

      - name: Install dependencies and configure preproduction
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_SECRET: ${{ secrets.PREPROD_APP_SECRET }}
          DB_HOST: ${{ secrets.PREPROD_DB_HOST || 'localhost' }}
          DB_NAME: ${{ secrets.PREPROD_DB_NAME }}
          DB_USER: ${{ secrets.PREPROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PREPROD_DB_PASSWORD }}
          DB_SERVER_VERSION: ${{ secrets.PREPROD_DB_SERVER_VERSION || '10.11.19-MariaDB' }}
        with:
          host: ${{ secrets.PREPROD_SSH_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.PREPROD_SSH_USER || secrets.SSH_USER }}
          key: ${{ secrets.PREPROD_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PREPROD_SSH_PORT || secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: APP_SECRET,DB_HOST,DB_NAME,DB_USER,DB_PASSWORD,DB_SERVER_VERSION
          script: |
            set -eu

            SERVER_DIR='${{ secrets.PREPROD_SSH_SERVER_DIR || '/home/olympiam/domains/test.olympia-madagascar.mg/public_html' }}'
            cd "$SERVER_DIR"

            umask 077
            if [ -z "${APP_SECRET:-}" ] || [ -z "${DB_NAME:-}" ] || [ -z "${DB_USER:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
              echo "ERROR: preproduction secrets are incomplete."
              exit 1
            fi

            printf '%s\n' \
              'APP_ENV=prod' \
              'APP_DEBUG=0' \
              'APP_SHARE_DIR=var/share' \
              'DEFAULT_URI=https://test.olympia-madagascar.mg' \
              'MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0' \
              'MAILER_DSN=null://null' > .env

            printf 'APP_ENV=prod\nAPP_DEBUG=0\nAPP_SECRET=%s\nDATABASE_URL="mysql://%s:%s@%s:3306/%s?serverVersion=%s&charset=utf8mb4"\n' \
              "$APP_SECRET" "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$DB_NAME" "$DB_SERVER_VERSION" > .env.local

            export APP_ENV=prod
            export APP_DEBUG=0
            mkdir -p var/cache var/log var/share

            command -v php >/dev/null 2>&1 || { echo "ERROR: PHP is not available."; exit 1; }
            php -r 'if (PHP_VERSION_ID < 80200) { fwrite(STDERR, "ERROR: PHP 8.2 or newer is required.\n"); exit(1); }'

            if command -v composer >/dev/null 2>&1; then
              COMPOSER_BIN="$(command -v composer)"
            elif [ -x "$HOME/.local/bin/composer" ]; then
              COMPOSER_BIN="$HOME/.local/bin/composer"
            else
              command -v curl >/dev/null 2>&1 || { echo "ERROR: Composer is not available and curl is missing."; exit 1; }
              COMPOSER_DIR="$HOME/.local/bin"
              INSTALLER_DIR="$(mktemp -d)"
              curl -fsSL https://composer.github.io/installer.sig -o "$INSTALLER_DIR/installer.sig"
              curl -fsSL https://getcomposer.org/installer -o "$INSTALLER_DIR/composer-setup.php"
              EXPECTED_CHECKSUM="$(tr -d '\r\n' < "$INSTALLER_DIR/installer.sig")"
              ACTUAL_CHECKSUM="$(php -r 'echo hash_file("sha384", $argv[1]);' "$INSTALLER_DIR/composer-setup.php")"
              if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
                echo "ERROR: Composer installer checksum is invalid."
                rm -rf "$INSTALLER_DIR"
                exit 1
              fi
              mkdir -p "$COMPOSER_DIR"
              php "$INSTALLER_DIR/composer-setup.php" --install-dir="$COMPOSER_DIR" --filename=composer
              rm -rf "$INSTALLER_DIR"
              COMPOSER_BIN="$COMPOSER_DIR/composer"
            fi

            "$COMPOSER_BIN" --version
            command -v npm >/dev/null 2>&1 || { echo "ERROR: npm is not available on the SSH server. Enable Node.js/npm in the hosting panel."; exit 1; }

            "$COMPOSER_BIN" install \
              --no-dev \
              --no-scripts \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader

            npm ci --include=dev --no-audit --no-fund
            npm run build

            php bin/console assets:install public --env=prod --no-interaction
            php bin/console tailwind:build --env=prod --no-interaction
            rm -rf public/assets
            php bin/console importmap:install --env=prod --no-interaction
            php bin/console assets:install public --env=prod --no-interaction
            php bin/console asset-map:compile --env=prod --no-interaction

            mkdir -p public/assets/vendor/hotwired
            cp -R public/assets/vendor/@hotwired/. public/assets/vendor/hotwired/
            mkdir -p public/assets/symfony
            cp -R public/assets/@symfony/. public/assets/symfony/
            sed -i \
              -e 's#/assets/vendor/@hotwired/#/assets/vendor/hotwired/#g' \
              -e 's#/assets/@symfony/#/assets/symfony/#g' \
              public/assets/importmap.json

            php bin/console doctrine:migrations:sync-metadata-storage --env=prod --no-interaction
            php bin/console doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration
            php bin/console cache:clear --env=prod

            find public -type d -exec chmod 755 {} +
            find public -type f -exec chmod 644 {} +

            echo "Preproduction deployment completed."
