name: Deploy Olympia

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: olympia-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compiler les assets CSS
        run: |
          npm ci
          npm run build

      - name: Vérifier la feuille CSS compilée
        run: test -s public/build/app.css

      - name: Déployer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/
          local-dir: ./
          security: strict
          exclude: |
            **/.git*/**
            **/.git*
            **/.env.dev
            **/.env.test
            **/.env.local
            **/.env.local.php
            **/node_modules/**
            # Exclude Composer's root vendor directory, but keep
            # public/assets/vendor: AssetMapper puts the @hotwired packages there.
            vendor/**
            **/var/**
            **/public/uploads/**
            **/.phpunit.cache/**

      - name: Installer les dépendances PHP sur le serveur
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DB_HOST: ${{ secrets.HOST_BASE }}
          DB_NAME: ${{ secrets.NOM_BASE }}
          DB_USER: ${{ secrets.NOM_UTILISATEUR }}
          DB_PASSWORD: ${{ secrets.MOT_DE_PASSE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: APP_SECRET,DB_HOST,DB_NAME,DB_USER,DB_PASSWORD
          script: |
            set -e

            SERVER_DIR='${{ secrets.SSH_SERVER_DIR || '/home/olympiam/domains/olympia-madagascar.mg/public_html' }}'

            cd "$SERVER_DIR"

            echo "Dossier : $(pwd)"
            umask 077

            printf '%s\n' \
              'APP_ENV=prod' \
              'APP_DEBUG=0' \
              'APP_SHARE_DIR=var/share' \
              'DEFAULT_URI=https://olympia-madagascar.mg' \
              'MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0' \
              'MAILER_DSN=null://null' > .env

            if [ -z "${APP_SECRET:-}" ] || [ -z "${DB_HOST:-}" ] || [ -z "${DB_NAME:-}" ] || [ -z "${DB_USER:-}" ] || [ -z "${DB_PASSWORD:-}" ]; then
              echo "ERREUR : les secrets de production sont incomplets."
              exit 1
            fi
            printf 'APP_ENV=prod\nAPP_DEBUG=0\nAPP_SECRET=%s\nDATABASE_URL="mysql://%s:%s@%s:3306/%s?serverVersion=8.0.0&charset=utf8mb4"\n' \
              "$APP_SECRET" "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$DB_NAME" > .env.local

            if ! grep -q '^APP_ENV=prod$' .env.local || ! grep -q '^APP_DEBUG=0$' .env.local; then
              echo "ERREUR : .env.local n'est pas configuré pour la production."
              exit 1
            fi

            export APP_ENV=prod
            export APP_DEBUG=0
            mkdir -p var/cache var/log var/share

            if ! command -v php >/dev/null 2>&1; then
              echo "ERREUR : PHP n'est pas disponible."
              exit 1
            fi

            if ! command -v composer >/dev/null 2>&1; then
              echo "ERREUR : Composer n'est pas disponible."
              exit 1
            fi

            echo "Installation des dépendances PHP..."

            composer install \
              --no-dev \
              --no-scripts \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader

            echo "Installation des assets de l'importmap..."
            # Les assets publics doivent être lisibles par Apache/Nginx.
            umask 022
            php bin/console importmap:install --env=prod --no-interaction

            # Le dossier var/ est exclu du transfert FTP : supprimer un ancien
            # cache dev évite de réutiliser une configuration qui charge DebugBundle.
            rm -rf var/cache/dev var/cache/test

            echo "Compilation des assets Tailwind sur le serveur..."
            php bin/console tailwind:build --env=prod --no-interaction --minify

            php bin/console doctrine:migrations:migrate \
              --env=prod \
              --no-interaction \
              --allow-no-migration
            php bin/console cache:clear --env=prod
            rm -rf public/assets
            php bin/console asset-map:compile --env=prod --no-interaction

            # Certains hébergements refusent les URLs contenant des répertoires
            # commençant par « @ » (403 sur @hotwired et @symfony). Publier les
            # bundles sous des chemins neutres évite ce blocage Apache/Nginx.
            if [ -d public/assets/vendor/@hotwired ]; then
              mkdir -p public/assets/vendor/hotwired
              cp -R public/assets/vendor/@hotwired/. public/assets/vendor/hotwired/
            fi
            if [ -d public/assets/@symfony ]; then
              mkdir -p public/assets/symfony
              cp -R public/assets/@symfony/. public/assets/symfony/
            fi
            sed -i \
              -e 's#/assets/vendor/@hotwired/#/assets/vendor/hotwired/#g' \
              -e 's#/assets/@symfony/#/assets/symfony/#g' \
              public/assets/importmap.json

            # Apache must be able to traverse every generated directory and read
            # every generated asset.  This also protects against an old umask on
            # the hosting account.
            find public/assets public/build -type d -exec chmod 755 {} +
            find public/assets public/build -type f -exec chmod 644 {} +

            # Fail the deployment if the importmap references packages that were
            # not compiled or are not readable by the web server.
            test -s public/assets/importmap.json
            test -n "$(find public/assets/vendor/hotwired/stimulus -type f -name '*.js' -readable -print -quit)"
            test -n "$(find public/assets/vendor/hotwired/turbo -type f -name '*.js' -readable -print -quit)"

            echo "Déploiement terminé."
