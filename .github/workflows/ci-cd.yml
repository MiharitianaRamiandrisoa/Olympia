name: CI/CD Olympia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: olympia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests et validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: olympia_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uapp -papp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: ci-secret-not-for-production
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/olympia_test?serverVersion=8.4.0&charset=utf8mb4

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Valider Composer
        run: composer validate --no-check-publish

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Compiler Tailwind
        run: npm run build

      - name: Vérifier le conteneur Symfony
        run: php bin/console lint:container --env=test

      - name: Vérifier les templates Twig
        run: php bin/console lint:twig templates --env=test

      - name: Compiler les assets AssetMapper
        run: php bin/console asset-map:compile --env=prod

      - name: Exécuter PHPUnit
        run: php bin/phpunit --testdox

  deploy:
    name: Déploiement production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP pour compiler les assets
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Installer les dépendances PHP
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer les dépendances JavaScript
        run: npm ci

      - name: Compiler les assets
        run: |
          npm run build
          php bin/console asset-map:compile --env=prod

      - name: Configurer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Ajouter le serveur aux hôtes connus
        run: ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Transférer le projet
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: >-
          rsync -az
          --exclude='.git/'
          --exclude='.env*'
          --exclude='node_modules/'
          --exclude='var/'
          --exclude='public/uploads/'
          ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"

      - name: Installer et préparer Symfony sur le serveur
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader"
          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && php bin/console asset-map:compile --env=prod && php bin/console cache:clear --env=prod"
          ssh "$SERVER_USER@$SERVER_HOST" "cd '$SERVER_PATH' && chmod -R ug+rw var public/uploads 2>/dev/null || true"

      - name: Vérifier le site en production
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: curl --fail --silent --show-error --location --max-time 30 "$APP_URL"
